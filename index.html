```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Simon Says</h1>
        <h2 id="level-title">Press any key to start</h2>

        <div class="score-board">
            <p>Level: <span id="level">0</span></p>
            <p>Best Score: <span id="best-score">0</span></p>
        </div>

        <div class="game-board">
            <button class="btn green" id="green" aria-label="Green button"></button>
            <button class="btn red" id="red" aria-label="Red button"></button>
            <button class="btn yellow" id="yellow" aria-label="Yellow button"></button>
            <button class="btn blue" id="blue" aria-label="Blue button"></button>
        </div>

        <p id="message">Watch the sequence and repeat it!</p>
        <button id="start-btn">Start Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
